openapi: 3.1.0
info:
  title: jupiq Control Plane API
  version: 1.4.5
  description: >-
    오프라인망 JupyterHub 통합 운영, 사용량, 정책, 승인, AI 및 MCP API.
    성공 응답은 기본적으로 data 필드를 사용하며 목록은 meta 페이지 정보를 포함한다.
    객체 범위 역할은 Hub 목록·상세·변경·삭제·테스트·동기화, 통합 사용자 목록,
    서버 목록·제어에만 적용된다. 그 밖의 관리·통계·검색·MCP API는 전역 권한이 필요하다.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerAuth: []
tags:
  - name: Auth
  - name: Operations
  - name: Administration
  - name: AI
paths:
  /version:
    get:
      security: []
      operationId: getVersion
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/login:
    post:
      security: []
      tags: [Auth]
      operationId: localLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204': { description: 로그아웃 완료 }
  /auth/password:
    post:
      tags: [Auth]
      operationId: changeLocalPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 12 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        '200': { $ref: '#/components/responses/Success' }
    patch:
      tags: [Auth]
      operationId: updateCurrentUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                email: { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/oidc/config:
    get:
      security: []
      tags: [Auth]
      operationId: getOIDCLoginConfig
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/oidc/login:
    get:
      security: []
      tags: [Auth]
      operationId: startOIDCLogin
      description: >-
        return_to는 암호화된 OIDC state에 담겨 callback 이후 이동할 화면으로 사용된다.
        같은 origin의 절대 경로만 허용하며 그 외의 값은 "/"로 대체한다.
      parameters:
        - name: return_to
          in: query
          required: false
          schema: { type: string, maxLength: 512, pattern: '^/(?!/).*' }
      responses:
        '302': { description: Keycloak authorization endpoint로 이동 }
  /auth/oidc/callback:
    get:
      security: []
      tags: [Auth]
      operationId: completeOIDCLogin
      description: >-
        Keycloak이 돌려보내는 redirect 경로다. state 쿠키와 code·state 질의값이 모두 일치해야 하며
        성공하면 세션 쿠키를 발급하고 state에 담긴 return_to 화면으로 이동한다.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: 세션 쿠키 발급 후 return_to 화면으로 이동 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /features:
    get:
      tags: [Operations]
      operationId: getFeatureStatus
      description: 인증 사용자 메뉴 구성에 필요한 전역 기능 활성 상태만 반환한다.
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /search:
    get:
      tags: [Operations]
      operationId: globalSearch
      description: 전역 조회 권한이 있는 리소스만 검색한다. 객체 범위 권한은 검색 결과로 확장되지 않는다.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /dashboard:
    get:
      tags: [Operations]
      operationId: getDashboard
      parameters:
        - { name: hub, in: query, schema: { type: string } }
        - { name: network, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { type: string } }
        - { name: project, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /dashboard/live:
    get:
      tags: [Operations]
      operationId: streamDashboard
      responses:
        '200':
          description: 5초 주기 기본 SSE data 이벤트
          content:
            text/event-stream:
              schema: { type: string }
  /usage:
    get:
      tags: [Operations]
      operationId: getUsage
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: granularity, in: query, schema: { type: string, enum: [hour, day, week, month] } }
        - { name: group_by, in: query, schema: { type: string, enum: [user, hub, network, department, project] } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /llm-usage:
    get:
      tags: [Operations]
      operationId: getLLMUsage
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [day, week, month] } }
        - { name: group_by, in: query, schema: { type: string, enum: [user, pod, model] } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /llm-usage/live:
    get:
      tags: [Operations]
      operationId: streamLLMUsage
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [day, week, month] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: group_by, in: query, schema: { type: string, enum: [user, pod, model, detail] } }
      responses:
        '200':
          description: 실시간 SSE data 이벤트
          content: { text/event-stream: { schema: { type: string } } }
  /hubs:
    get:
      tags: [Administration]
      operationId: listHubs
      description: 전역 hubs:read 또는 할당된 Hub 범위만 반환한다.
      x-access-scope: global-or-hub
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Administration]
      operationId: createHub
      description: 새 객체에는 기존 범위를 적용할 수 없으므로 전역 hubs:write가 필요하다.
      x-access-scope: global-only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HubWrite' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /hubs/{id}:
    parameters:
      - { $ref: '#/components/parameters/ID' }
    get:
      operationId: getHub
      x-access-scope: global-or-target-hub
      responses: { '200': { $ref: '#/components/responses/Success' } }
    put:
      operationId: updateHub
      x-access-scope: global-or-target-hub
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HubWrite' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      operationId: deleteHub
      x-access-scope: global-or-target-hub
      responses: { '204': { description: 삭제 완료 } }
  /hubs/{id}/test:
    post:
      parameters: [{ $ref: '#/components/parameters/ID' }]
      operationId: testHub
      x-access-scope: global-or-target-hub
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /hubs/{id}/sync:
    post:
      parameters: [{ $ref: '#/components/parameters/ID' }]
      operationId: syncHub
      x-access-scope: global-or-target-hub
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /users:
    get:
      tags: [Operations]
      operationId: listHubUsers
      summary: Hub별 통합 사용자와 현재 실행 자원 조회
      description: >-
        JupyterHub 원본 응답에서 허용된 roles만 노출하고, 현재 실행 서버의 상태·개수·
        총 실행시간·CPU·RAM 및 가장 최근 활동 시각을 Hub별 사용자 행으로 집계한다.
      x-required-permission: users:read
      x-access-scope: global-or-hub-and-department
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: hub_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: search, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/SortOrder' }
      responses:
        '200':
          description: 통합 사용자 목록
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ManagedHubUser' }
                  meta:
                    type: object
                    required: [page, page_size, total]
                    properties:
                      page: { type: integer }
                      page_size: { type: integer }
                      total: { type: integer }
  /users/{username}:
    get:
      tags: [Operations]
      operationId: getUserDetail360
      summary: 사용자 360 상세 조회
      description: >-
        중앙 계정, Hub별 identity, 현재·과거 서버, 최근 메타데이터 timeline,
        일·주·월 사용량 및 선택적 LLM 사용 메타데이터를 조회한다.
        Notebook 코드, 셀 출력, AI prompt/response 본문은 수집하거나 반환하지 않는다.
      x-required-permission: users:read
      x-access-scope: global-only
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._@+-]{0,127}$' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: include_llm
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 사용자 360 상세
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/UserDetail360' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /local-users:
    get:
      tags: [Administration]
      operationId: listServiceUsers
      x-access-scope: global-only
      responses:
        '200':
          description: 서비스 계정과 역할 binding 목록
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ServiceUser' } }
                  meta: { type: object, additionalProperties: true }
  /local-users/{id}/roles:
    put:
      tags: [Administration]
      operationId: setServiceUserRoles
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [bindings]
                  properties:
                    bindings:
                      type: array
                      maxItems: 64
                      items: { $ref: '#/components/schemas/RoleBindingWrite' }
                - type: object
                  deprecated: true
                  description: 기존 global 할당 전용. 제한 binding이 있으면 409로 거부된다.
                  required: [role_ids]
                  properties:
                    role_ids: { type: array, maxItems: 64, items: { type: integer, format: int64 } }
      responses:
        '200':
          description: 갱신된 서비스 계정
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ServiceUser' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /roles:
    get:
      tags: [Administration]
      operationId: listRoles
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Administration]
      operationId: createRole
      requestBody: { $ref: '#/components/requestBodies/RoleWrite' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /roles/{id}:
    put:
      tags: [Administration]
      operationId: updateRole
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { $ref: '#/components/requestBodies/RoleWrite' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Administration]
      operationId: deleteRole
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '204': { description: 삭제 완료 } }
  /servers:
    get:
      tags: [Operations]
      operationId: listServers
      description: 전역 servers:read 또는 Hub·부서 범위 교집합의 행만 SQL pagination 전에 반환한다.
      x-access-scope: global-or-hub-and-department
      parameters:
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/SortOrder' }
      responses: { '200': { $ref: '#/components/responses/List' } }
  /servers/{id}/{action}:
    post:
      tags: [Operations]
      operationId: controlServer
      x-access-scope: global-or-target-hub-and-department
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { name: action, in: path, required: true, schema: { type: string, enum: [start, stop, restart] } }
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /approvals:
    get:
      tags: [Administration]
      operationId: listApprovals
      description: 승인 요청 목록. 상태는 pending_review, pending, executing, approved, rejected, failed 중 하나다.
      responses: { '200': { $ref: '#/components/responses/List' } }
  /approvals/{id}:
    get:
      tags: [Administration]
      operationId: getApproval
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /approvals/{id}/review:
    post:
      tags: [Administration]
      operationId: reviewApproval
      description: approval:review 권한으로 pending_review 요청을 pending으로 전이한다.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { $ref: '#/components/requestBodies/ApprovalReason' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /approvals/{id}/approve:
    post:
      tags: [Administration]
      operationId: approveRequest
      description: pending을 원자적으로 executing으로 선점한 요청만 원격 작업을 수행한다.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { $ref: '#/components/requestBodies/ApprovalReason' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /approvals/{id}/reject:
    post:
      tags: [Administration]
      operationId: rejectRequest
      description: pending_review 또는 pending 요청을 rejected로 전이한다.
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { $ref: '#/components/requestBodies/ApprovalReason' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /integrations/test:
    post:
      tags: [Administration]
      operationId: testIntegration
      description: >-
        현재 요청의 설정값을 저장하지 않고 외부 연결을 검증한다. jupyterhub는
        hubs:write 권한이 필요하고, config.hub_id와 빈 secret을 전달하면 해당 Hub에
        저장된 암호화 token을 사용하되 저장된 base_url·verify_tls와 정확히 결합한다.
        대상 또는 TLS 설정이 바뀌면 secret을 다시 제출해야 한다. 다른 연동 유형은
        settings:write 권한이 필요하며 저장 secret 재사용에도 같은 대상 결합 규칙을 적용한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, config]
              properties:
                type: { type: string, enum: [oidc, jupyterhub, prometheus, kubernetes, ai, webhook, llm_usage] }
                config:
                  type: object
                  additionalProperties: true
                  description: jupyterhub 편집 preflight에서는 선택적으로 hub_id를 포함한다.
                secret: { type: string, writeOnly: true }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /audit:
    get:
      tags: [Administration]
      operationId: listAuditEvents
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/SortOrder' }
      responses: { '200': { $ref: '#/components/responses/List' } }
  /metrics:
    get:
      tags: [Operations]
      operationId: listMetricSamples
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: metric, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 5000 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /gpus:
    get:
      tags: [Operations]
      operationId: listGPUs
      description: GPU 기능이 꺼져 있으면 feature_enabled=false와 빈 목록을 반환한다.
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /settings:
    get:
      tags: [Administration]
      operationId: getSettings
      responses: { '200': { $ref: '#/components/responses/Success' } }
    put:
      tags: [Administration]
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /keys:
    get:
      operationId: listPersonalKeys
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      operationId: createPersonalKey
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
                permissions: { type: array, items: { type: string }, description: scopes 별칭 }
                expires_at: { type: string, format: date-time }
                expires_in_days: { type: integer, minimum: 1 }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /keys/{id}/rotate:
    post:
      parameters: [{ $ref: '#/components/parameters/ID' }]
      operationId: rotatePersonalKey
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /keys/{id}/revoke:
    post:
      parameters: [{ $ref: '#/components/parameters/ID' }]
      operationId: revokePersonalKey
      responses: { '204': { description: 폐기 완료 } }
  /ai/chat:
    post:
      tags: [AI]
      operationId: streamAIChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model: { type: string }
                messages: { type: array, items: { type: object, additionalProperties: true } }
                max_tokens: { type: integer, minimum: 1, maximum: 262144 }
                temperature: { type: number }
      responses:
        '200':
          description: OpenAI 호환 SSE 스트림
          content: { text/event-stream: { schema: { type: string } } }
  /policies:
    get: { tags: [Administration], operationId: listPolicies, parameters: [{ $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/SortOrder' }], responses: { '200': { $ref: '#/components/responses/List' } } }
    post: { tags: [Administration], operationId: createPolicy, requestBody: { $ref: '#/components/requestBodies/ResourceWrite' }, responses: { '201': { $ref: '#/components/responses/Success' } } }
  /policies/{id}:
    get: { tags: [Administration], operationId: getPolicy, parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
