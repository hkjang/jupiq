    post: { tags: [Administration], operationId: createIncident, requestBody: { $ref: '#/components/requestBodies/ResourceWrite' }, responses: { '201': { $ref: '#/components/responses/Success' } } }
  /incidents/{id}:
    get: { tags: [Administration], operationId: getIncident, parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
    put: { tags: [Administration], operationId: updateIncident, parameters: [{ $ref: '#/components/parameters/ID' }], requestBody: { $ref: '#/components/requestBodies/ResourceWrite' }, responses: { '200': { $ref: '#/components/responses/Success' } } }
    delete: { tags: [Administration], operationId: deleteIncident, parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: 삭제 완료 } } }
  /notifications:
    get: { tags: [Administration], operationId: listNotifications, parameters: [{ $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/SortOrder' }], responses: { '200': { $ref: '#/components/responses/List' } } }
    post: { tags: [Administration], operationId: createNotification, requestBody: { $ref: '#/components/requestBodies/ResourceWrite' }, responses: { '201': { $ref: '#/components/responses/Success' } } }
  /notifications/{id}:
    get: { tags: [Administration], operationId: getNotification, parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
    put: { tags: [Administration], operationId: updateNotification, parameters: [{ $ref: '#/components/parameters/ID' }], requestBody: { $ref: '#/components/requestBodies/ResourceWrite' }, responses: { '200': { $ref: '#/components/responses/Success' } } }
    delete: { tags: [Administration], operationId: deleteNotification, parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: 삭제 완료 } } }
  /costs:
    get: { tags: [Administration], operationId: listCosts, parameters: [{ $ref: '#/components/parameters/Sort' }, { $ref: '#/components/parameters/SortOrder' }], responses: { '200': { $ref: '#/components/responses/List' } } }
    post: { tags: [Administration], operationId: createCost, requestBody: { $ref: '#/components/requestBodies/ResourceWrite' }, responses: { '201': { $ref: '#/components/responses/Success' } } }
  /costs/{id}:
    get: { tags: [Administration], operationId: getCost, parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '200': { $ref: '#/components/responses/Success' } } }
    put: { tags: [Administration], operationId: updateCost, parameters: [{ $ref: '#/components/parameters/ID' }], requestBody: { $ref: '#/components/requestBodies/ResourceWrite' }, responses: { '200': { $ref: '#/components/responses/Success' } } }
    delete: { tags: [Administration], operationId: deleteCost, parameters: [{ $ref: '#/components/parameters/ID' }], responses: { '204': { description: 삭제 완료 } } }
  /mcp:
    post:
      tags: [AI]
      operationId: mcpStreamableHTTP
      description: /mcp의 /api/v1 별칭. initialize, ping, tools/list, tools/call 지원.
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: JSON-RPC JSON 또는 SSE 응답
          content:
            application/json: { schema: { type: object, additionalProperties: true } }
            text/event-stream: { schema: { type: string } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: jupiq_session }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT-or-jqk }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    Sort:
      name: sort
      in: query
      required: false
      description: >-
        정렬할 컬럼. 목록별 허용 목록에 있는 이름만 적용하고 그 외에는 기본
        정렬을 유지한다. 값이 없는 행은 방향과 무관하게 뒤로 정렬한다.
      schema: { type: string, maxLength: 64 }
    SortOrder:
      name: order
      in: query
      required: false
      description: 정렬 방향. desc가 아니면 오름차순으로 처리한다.
      schema: { type: string, enum: [asc, desc] }
  requestBodies:
    ApprovalReason:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason: { type: string, description: workflow.require_reason=true이면 필수 }
    RoleWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [key, name, permissions]
            properties:
              key: { type: string }
              name: { type: string }
              description: { type: string }
              permissions: { type: array, items: { type: string } }
    ResourceWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string }
              status: { type: string }
              owner_user_id: { type: integer, format: int64 }
              data: { type: object, additionalProperties: true }
            additionalProperties: true
  schemas:
    ScopeClause:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [hub, department] }
        value: { type: string, minLength: 1, maxLength: 256, description: hub은 양의 정수 ID, department는 정확한 부서명 }
    RoleBindingWrite:
      type: object
      required: [role_id, scope_mode, scopes]
      properties:
        role_id: { type: integer, format: int64, minimum: 1 }
        scope_mode: { type: string, enum: [global, restricted] }
        scopes:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/ScopeClause' }
          description: global이면 비어 있어야 하고 restricted이면 하나 이상 필요하다. Hub와 부서는 AND, 같은 유형 값은 OR이다.
    RoleBinding:
      allOf:
        - { $ref: '#/components/schemas/RoleBindingWrite' }
        - type: object
          required: [role_key, role_name, permissions]
          properties:
            role_key: { type: string }
            role_name: { type: string }
            permissions: { type: array, items: { type: string } }
    ServiceUser:
      type: object
      required: [id, username, active, roles, permissions, global_permissions, scoped_permissions, role_bindings]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        department: { type: string }
        auth_source: { type: string, enum: [local, oidc] }
        active: { type: boolean }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string }, description: 전역 및 제한 permission의 UI용 합집합 }
        global_permissions: { type: array, items: { type: string } }
        scoped_permissions: { type: array, items: { type: string } }
        role_bindings: { type: array, items: { $ref: '#/components/schemas/RoleBinding' } }
    HubWrite:
      type: object
      required: [name, base_url, network]
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        base_url: { type: string, format: uri, maxLength: 4096 }
        network: { type: string, minLength: 1, maxLength: 256 }
        enabled: { type: boolean }
        verify_tls: { type: boolean, default: true }
        collect_interval_seconds: { type: integer, minimum: 30, maximum: 3600 }
        api_token: { type: string, writeOnly: true, maxLength: 65536, description: 새 Hub 등록 시 필수. 편집 시 URL과 TLS 검증 설정이 같으면 생략 가능 }
    ManagedHubUser:
      type: object
      required: [id, hub_id, hub_name, username, display_name, department, admin, active, roles, server_status, server_count, running_server_count, runtime_seconds, synced_at]
      properties:
        id: { type: integer, format: int64 }
        hub_id: { type: integer, format: int64 }
        hub_name: { type: string }
        username: { type: string }
        display_name: { type: string }
        department: { type: string }
        admin: { type: boolean }
        active: { type: boolean }
        roles: { type: array, items: { type: string }, maxItems: 64 }
        server_status: { type: string, enum: ['', stopped, starting, pending, active, running] }
        server_count: { type: integer, format: int64, minimum: 0, description: 중지되지 않은 현재 서버 수 }
        running_server_count: { type: integer, format: int64, minimum: 0 }
        runtime_seconds: { type: integer, format: int64, minimum: 0, description: 현재 running 서버 실행시간의 합 }
        cpu_cores: { type: [number, 'null'], description: 모든 running 서버에서 값이 수집된 경우의 합 }
        memory_bytes: { type: [integer, 'null'], format: int64, description: 모든 running 서버에서 값이 수집된 경우의 합 }
        last_activity_at: { type: [string, 'null'], format: date-time }
        synced_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
    UserDetailPage:
      type: object
      required: [page, limit, total]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    UserServerMetadata:
      type: object
      required: [id, hub_id, hub_name, network, username, server_name, status, synced_at]
      properties:
        id: { type: integer, format: int64 }
        hub_id: { type: integer, format: int64 }
        hub_name: { type: string }
        network: { type: string }
        username: { type: string }
        server_name: { type: string }
        status: { type: string }
        started_at: { type: [string, 'null'], format: date-time }
        last_activity_at: { type: [string, 'null'], format: date-time }
        url: { type: string }
        node_name: { type: string }
        pod_name: { type: string }
        image: { type: string }
        cpu_cores: { type: [number, 'null'] }
        memory_bytes: { type: [integer, 'null'], format: int64 }
        gpu_count: { type: [integer, 'null'] }
        synced_at: { type: string, format: date-time }
    UserUsagePeriod:
      type: object
      required: [from, to, sample_count, login_count, server_count, server_start_count, current_servers, runtime_seconds]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        sample_count: { type: integer, format: int64 }
        login_count: { type: integer, format: int64 }
        server_count: { type: integer, format: int64 }
        server_start_count: { type: integer, format: int64 }
        current_servers: { type: integer, format: int64 }
        runtime_seconds: { type: number }
        cpu_average: { type: number }
        cpu_peak: { type: number }
        memory_average: { type: number }
        memory_peak: { type: number }
        gpu_average: { type: number }
        gpu_peak: { type: number }
        last_activity_at: { type: [string, 'null'], format: date-time }
    UserDetail360:
      type: object
      required: [username, user, hubs, servers, timeline, usage, llm_usage, feature_enabled, data_policy]
      properties:
        username: { type: string }
        user:
          type: [object, 'null']
          description: 중앙 서비스 계정. Hub에만 존재하면 null.
          additionalProperties: true
        hubs:
          type: array
          items:
            type: object
            required: [id, hub_id, hub_name, network, username, admin, active, synced_at]
            properties:
              id: { type: integer, format: int64 }
              hub_id: { type: integer, format: int64 }
              hub_name: { type: string }
              network: { type: string }
              hub_status: { type: string }
              hub_version: { type: string }
              username: { type: string }
              display_name: { type: string }
              department: { type: string }
              admin: { type: boolean }
              active: { type: boolean }
              last_activity_at: { type: [string, 'null'], format: date-time }
              synced_at: { type: string, format: date-time }
        servers:
          type: object
          required: [current, current_total, history, meta]
          properties:
            current: { type: array, items: { $ref: '#/components/schemas/UserServerMetadata' } }
            current_total: { type: integer, minimum: 0 }
            history: { type: array, items: { $ref: '#/components/schemas/UserServerMetadata' } }
            meta: { $ref: '#/components/schemas/UserDetailPage' }
        timeline:
          type: object
          required: [items, meta]
          properties:
            items:
              type: array
              items:
                type: object
                required: [id, category, action, actor_username, resource_type, resource_id, result, occurred_at]
                properties:
                  id: { type: string }
                  category: { type: string, enum: [audit, server, activity] }
                  action: { type: string }
                  actor_username: { type: string }
                  resource_type: { type: string }
                  resource_id: { type: string }
                  hub_id: { type: integer, format: int64 }
                  hub_name: { type: string }
                  server_id: { type: integer, format: int64 }
                  result: { type: string }
                  reason: { type: string }
                  occurred_at: { type: string, format: date-time }
            meta: { $ref: '#/components/schemas/UserDetailPage' }
        usage:
          type: object
          required: [day, week, month]
          properties:
            day: { $ref: '#/components/schemas/UserUsagePeriod' }
            week: { $ref: '#/components/schemas/UserUsagePeriod' }
            month: { $ref: '#/components/schemas/UserUsagePeriod' }
        llm_usage:
          type: object
          description: 호출 수, 성공률, 지연, token, 비용의 메타데이터만 포함한다.
          additionalProperties: true
        feature_enabled:
          type: object
          properties:
            gpu_monitoring: { type: boolean }
            llm_usage_monitoring: { type: boolean }
        data_policy:
          type: object
          required: [metadata_only, prompt_collected, code_collected]
          properties:
            metadata_only: { type: boolean, const: true }
            prompt_collected: { type: boolean, const: false }
            code_collected: { type: boolean, const: false }
  responses:
    Success:
      description: 성공
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties: { data: {} }
    List:
      description: 목록 성공
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { type: array, items: {} }
              meta:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
    Error:
      description: 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
