<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">jupiq — AI Workspace Control Plane</title>
  <desc id="desc">분리된 JupyterHub를 하나의 운영 화면으로 연결하는 오프라인망 통합 관리 플랫폼</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071328"/><stop offset="1" stop-color="#16315b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79a7ff"/><stop offset="1" stop-color="#45d6bd"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#45d6bd" stop-opacity=".3"/><stop offset="1" stop-color="#45d6bd" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="90" r="360" fill="url(#glow)"/>
  <g transform="translate(80 78)"><rect width="112" height="112" rx="30" fill="#152647"/><path d="M30 30h24v42c0 12-7 18-18 18-6 0-11-2-15-4l7-17c3 2 5 3 7 3 3 0 4-2 4-6V48h-9z" fill="url(#accent)"/><circle cx="82" cy="30" r="9" fill="#45d6bd"/><circle cx="84" cy="80" r="7" fill="#79a7ff"/><path d="M67 38c17 4 25 15 24 29" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/></g>
  <text x="220" y="165" fill="#f5f9ff" font-family="Inter, Pretendard, Arial, sans-serif" font-size="82" font-weight="750" letter-spacing="-4">jupiq</text>
  <text x="80" y="290" fill="#f5f9ff" font-family="Inter, Pretendard, Arial, sans-serif" font-size="55" font-weight="700">분리된 AI 업무공간을</text>
  <text x="80" y="362" fill="#f5f9ff" font-family="Inter, Pretendard, Arial, sans-serif" font-size="55" font-weight="700">하나의 운영 화면으로</text>
  <text x="82" y="430" fill="#b7c8e7" font-family="Inter, Pretendard, Arial, sans-serif" font-size="28">실시간 사용 현황 · GPU 효율 · 정책 · 감사 · AI 운영 분석</text>
