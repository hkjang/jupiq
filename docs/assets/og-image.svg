    <path d="M75 75 215 165 75 255M215 165l142-88m-142 88 142 90" stroke="#79a7ff" stroke-width="6" opacity=".58"/>
    <circle cx="215" cy="165" r="54" fill="#152647" stroke="#45d6bd" stroke-width="6"/>
    <circle cx="75" cy="75" r="38" fill="#152647" stroke="#79a7ff" stroke-width="5"/><circle cx="75" cy="255" r="38" fill="#152647" stroke="#79a7ff" stroke-width="5"/><circle cx="357" cy="77" r="38" fill="#152647" stroke="#79a7ff" stroke-width="5"/><circle cx="357" cy="255" r="38" fill="#152647" stroke="#79a7ff" stroke-width="5"/>
  </g>
</svg>
