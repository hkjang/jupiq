name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go 검사
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: jupiq_test
          POSTGRES_USER: jupiq
          POSTGRES_PASSWORD: ci-integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jupiq -d jupiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.7
          cache: true
      - name: 버전 정합성 확인
        run: ./scripts/check-version.sh
      - name: 모듈 무결성 확인
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: 정적 검사
        run: go vet ./...
      - name: Go 취약점 검사
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: 테스트
        run: go test -race -coverprofile=coverage.out ./...
      - name: PostgreSQL 통합 테스트
        env:
          JUPIQ_INTEGRATION_TEST_DSN: postgres://jupiq:ci-integration-password@127.0.0.1:5432/jupiq_test?sslmode=disable
        run: go test -count=1 -p=1 -run Integration ./internal/store ./internal/api

  frontend:
    name: React 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치
        run: npm ci 2>&1 | tee "${RUNNER_TEMP}/npm-ci.log"
      - name: 프런트엔드 취약점 검사
        env:
          NPM_CI_LOG: ${{ runner.temp }}/npm-ci.log
          NPM_AUDIT_SKIP: ${{ vars.NPM_AUDIT_SKIP }}
        run: bash ../scripts/npm-audit-retry.sh high
      - name: 제품 화면 정합성 확인
        working-directory: .
        run: node scripts/check-screenshots.mjs
      - name: 타입·린트 검사
        run: npm run lint
      - name: 테스트
        run: npm test
      - name: 프로덕션 빌드
        run: npm run build

  container:
    name: 컨테이너 빌드
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: VERSION 읽기
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: jupiq:v${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=1970-01-01T00:00:00Z
      - name: 이미지 메타데이터 확인
        run: docker image inspect "jupiq:v${{ steps.version.outputs.version }}" >/dev/null
