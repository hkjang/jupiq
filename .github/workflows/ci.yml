name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache: true
      - name: 모듈 무결성 확인
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: 정적 검사
        run: go vet ./...
      - name: Go 취약점 검사
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: 테스트
        run: go test -race -coverprofile=coverage.out ./...

  frontend:
    name: React 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 타입·린트 검사
        run: npm run lint
      - name: 테스트
        run: npm test
      - name: 프로덕션 빌드
        run: npm run build

  container:
    name: 컨테이너 빌드
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: VERSION 읽기
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: jupiq:v${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=1970-01-01T00:00:00Z
      - name: 이미지 메타데이터 확인
        run: docker image inspect "jupiq:v${{ steps.version.outputs.version }}" >/dev/null
